version: '3.8'

services:

  # ── Base de données MongoDB ──────────────────────
  mongo:
    image: mongo:7.0
    container_name: ecommerce_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ecommerce-network

  # ── Backend Node.js ──────────────────────────────
  backend:
    build: ./backend
    container_name: ecommerce_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=ecommerce
      - PORT=3000
    networks:
      - ecommerce-network

  # ── Générateur de données ────────────────────────
  data-generator:
    build: ./data-generator
    container_name: ecommerce_generator
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=ecommerce
    networks:
      - ecommerce-network

  # ── Frontend Dashboard ───────────────────────────
  frontend:
    build: ./frontend
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

# ── Volumes et réseaux ────────────────────────────
volumes:
  mongo-data:

networks:
  ecommerce-network:
    driver: bridge